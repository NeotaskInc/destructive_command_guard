# cargo-nextest configuration for git_safety_guard
# https://nexte.st/book/configuration.html

# =============================================================================
# Default Profile - Development
# =============================================================================
[profile.default]
# Fail fast during local development
fail-fast = true
# Run tests in parallel (default: number of CPUs)
test-threads = "num-cpus"
# Output format for local development
status-level = "pass"
final-status-level = "fail"
# Retry configuration
retries = 0
# Slow test thresholds
slow-timeout = { period = "30s", terminate-after = 2 }

# =============================================================================
# CI Profile - Continuous Integration
# =============================================================================
[profile.ci]
# Don't fail fast in CI - run all tests to get complete results
fail-fast = false
# Use all CPUs
test-threads = "num-cpus"
# Verbose output for CI logs
status-level = "all"
final-status-level = "all"
# Retry flaky tests once in CI
retries = 1
# Longer timeout for CI (may be slower)
slow-timeout = { period = "60s", terminate-after = 2 }
# Neotask fork (dev-igbgn, MON ruling): upstream v0.16.0's own tests that fail on the tag, on upstream main and here,
# excluded by exact name. NEOTASK-FORK.md lists each with its evidence; drop an entry once upstream passes it.
default-filter = """
not (
    (binary(=cli_e2e) & test(=custom_pack_loading_tests::exact_command_grants_do_not_reappear_after_detection_rewrites))
  | (binary(=cross_pack_corpus) & test(=cross_pack_true_positive_controls_still_deny))
  | (binary(=repro_277_git_stdin_sink_fallback) & test(=unquoted_delimiter_with_command_substitution_stays_denied))
  | (binary(=repro_313_powershell_read_only_false_positives) & test(=escaped_dcg_options_keep_agent_values_and_inspection_arguments_as_data))
  | (binary(=repro_313_powershell_read_only_false_positives) & test(=escaped_dcg_syntax_cannot_hide_guardrail_changes))
  | (binary(=repro_313_powershell_read_only_false_positives) & test(=global_options_preserve_inspection_and_argument_data))
  | (binary(=repro_313_powershell_read_only_false_positives) & test(=native_agent_argument_boundaries_are_dialect_specific))
  | (binary(=repro_393_heredoc_boundary_data_sink) & test(=executing_receivers_and_expanding_bodies_stay_denied))
  | (binary(=repro_558_ifs_destinations) & test(=literal_command_queries_and_quoted_wrapper_operands_remain_harmless))
)
"""

# JUnit XML output for CI integration
[profile.ci.junit]
# Output path for JUnit XML report (relative to store dir)
path = "junit.xml"
# Report name shown in CI systems
report-name = "git-safety-guard-test-results"
# Store output on failure for debugging
store-success-output = false
store-failure-output = true

# =============================================================================
# E2E Profile - End-to-end tests (sequential)
# =============================================================================
[profile.e2e]
# Don't fail fast - run all E2E tests
fail-fast = false
# E2E tests often need sequential execution
test-threads = 1
status-level = "all"
final-status-level = "all"
retries = 1
# E2E tests may take longer
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.e2e.junit]
path = "junit.xml"
report-name = "git-safety-guard-e2e-test-results"
store-success-output = false
store-failure-output = true

# =============================================================================
# Coverage Profile
# =============================================================================
[profile.ci-coverage]
fail-fast = false
test-threads = "num-cpus"
status-level = "all"
final-status-level = "all"
retries = 0
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.ci-coverage.junit]
path = "junit.xml"
report-name = "git-safety-guard-coverage-test-results"
store-success-output = false
store-failure-output = true

# Neotask fork (dev-igbgn, MON ruling #82548): upstream v0.16.0's tests that fail on Windows only, excluded on
